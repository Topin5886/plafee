<!doctype html>
<html lang="fr" data-backdrop="grid" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PLAFEE" />
    <meta name="description" content="PLAFEE — la salle d'arcade entre potes : Scopa, UNO, Flip 7 et Puissance 4, en ligne et sans installation." />
    <title>PLAFEE</title>

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/icon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/icon-180.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Aperçu des liens partagés (Discord, WhatsApp…) : les invitations à une table passent par là. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PLAFEE" />
    <meta property="og:title" content="PLAFEE — la salle d'arcade entre potes" />
    <meta property="og:description" content="Scopa, UNO, Flip 7 et Puissance 4, en ligne et sans installation." />
    <meta property="og:image" content="https://topin5886.github.io/plafee/brand/og-plafee.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      (function () {
        // Les réglages d'affichage (voir src/hooks/useTheme.ts), appliqués avant
        // le premier rendu pour éviter un éclair du mauvais fond.
        var root = document.documentElement;
        var b = 'grid', crt = 'on', fx = 'on';
        try {
          var v = localStorage.getItem('userTheme');
          if (v === 'grid' || v === 'void' || v === 'phosphor') b = v;
          if (localStorage.getItem('plafee-crt') === 'off') crt = 'off';
          if (localStorage.getItem('plafee-fx') === 'calm') fx = 'calm';
          var look = localStorage.getItem('plafee-look');
          if (look === 'noir' || look === 'blanc' || look === 'rgb') root.setAttribute('data-look', look);
          // Thèmes achetés à la boutique (voir src/features/plafee/PlafeeProvider.tsx).
          var skin = localStorage.getItem('plafee-skin');
          var cards = localStorage.getItem('plafee-cards');
          if (skin && /^[a-z]+$/.test(skin)) root.setAttribute('data-skin', skin);
          if (cards && /^[a-z]+$/.test(cards)) root.setAttribute('data-cards', cards);
        } catch (e) {}
        root.setAttribute('data-backdrop', b);
        root.setAttribute('data-theme', root.getAttribute('data-look') === 'blanc' ? 'light' : 'dark');
        root.setAttribute('data-crt', crt);
        root.setAttribute('data-fx', fx);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
